name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run against the official WordPress Theme Unit Test data.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lowest versions in package.json "engines", and the latest of each line.
        node: ['22.22.2', '24.15.0', 22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  integration:
    name: Integration tests (Payload 3 + SQLite, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test/payload-project/package-lock.json
      - run: npm ci
      - run: npm ci --prefix test/payload-project
      - run: npm run build
      - run: npm run test:integration

  external:
    name: WordPress Theme Unit Test data
    # Downloads test data from GitHub, so it runs weekly and on demand rather than on every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test/payload-project/package-lock.json
      - run: npm ci
      - run: npm ci --prefix test/payload-project
      - run: npm run build
      - run: npm run test:external

  package:
    name: Packed tarball installs and runs (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lowest versions in package.json "engines": installing must not warn about them.
        node: ['22.22.2', '24.15.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Install into an empty project and run
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          mkdir clean && cd clean
          npm init -y > /dev/null
          npm install --ignore-scripts "$RUNNER_TEMP"/wp-to-payload-*.tgz 2>&1 | tee install.log
          if grep -q EBADENGINE install.log; then
            echo "::error::A dependency does not support Node.js $(node --version); update engines in package.json."
            exit 1
          fi
          npx wp-to-payload --version
          npx wp-to-payload analyze "$GITHUB_WORKSPACE/test/fixtures/wxr/blog-gutenberg.xml" --out report
          test -s report/report.md
          npx wp-to-payload redirects "$GITHUB_WORKSPACE/test/fixtures/wxr/blog-gutenberg.xml" --format netlify
