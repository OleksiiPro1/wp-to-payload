name: Publish

# Publishes to npm when a version tag (v0.2.0, v0.3.0-beta.1, …) is pushed. Uses npm trusted
# publishing: npm trusts this workflow through GitHub's OIDC token, so no npm token is stored,
# and provenance is attached to every release automatically.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # OIDC token for trusted publishing and provenance

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    # Trusted publishing works on GitHub-hosted runners only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, to check that the tag points to a commit on main.
          fetch-depth: 0
          persist-credentials: false
      # No registry-url and no cache: registry-url writes an _authToken line into .npmrc that
      # gets in the way of OIDC, and a release job should not reuse caches from other runs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install npm 11.5.1 or newer
        run: npm install --global npm@^11.5.1
      - name: Check versions, tag and branch
        run: node scripts/check-release.mjs
      # A version can be published only once; tagging a version that is already on npm (such
      # as 0.1.0, published by hand) ends the run here instead of failing.
      - name: Skip versions that are already on npm
        id: npm
        run: |
          spec="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"
          if npm view "$spec" version > /dev/null 2>&1; then
            echo "::notice::$spec is already on npm; nothing to publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.npm.outputs.published != 'true'
        run: npm ci
      - if: steps.npm.outputs.published != 'true'
        run: npm run lint
      - if: steps.npm.outputs.published != 'true'
        run: npm run typecheck
      - if: steps.npm.outputs.published != 'true'
        run: npm test
      - if: steps.npm.outputs.published != 'true'
        run: npm run build
      - name: Publish to npm
        if: steps.npm.outputs.published != 'true'
        run: |
          version="$(node -p "require('./package.json').version")"
          dist_tag=latest
          case "$version" in *-*) dist_tag=next ;; esac
          npm publish --provenance --access public --tag "$dist_tag"
